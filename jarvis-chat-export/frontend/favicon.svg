<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="5" fill="#020813"/>
  <!-- outer ring -->
  <circle cx="16" cy="16" r="13.5" stroke="#00D9FF" stroke-width="0.6" fill="none" opacity="0.35"/>
  <!-- main ring -->
  <circle cx="16" cy="16" r="11.5" stroke="#00D9FF" stroke-width="1.4" fill="none" opacity="0.85"/>
  <!-- inner ring -->
  <circle cx="16" cy="16" r="7.5"  stroke="#00D9FF" stroke-width="1"   fill="none" opacity="0.65"/>
  <!-- hexagon frame -->
  <polygon points="16,9.8 20.7,12.4 20.7,19.6 16,22.2 11.3,19.6 11.3,12.4"
           stroke="#00D9FF" stroke-width="0.9" fill="rgba(0,217,255,0.08)"/>
  <!-- core ring -->
  <circle cx="16" cy="16" r="3.6"  stroke="#00D9FF" stroke-width="1"   fill="rgba(0,217,255,0.18)"/>
  <!-- center glow -->
  <circle cx="16" cy="16" r="1.8"  fill="#00D9FF"/>
  <circle cx="16" cy="16" r="0.8"  fill="white" opacity="0.9"/>
</svg>
